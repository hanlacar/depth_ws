/**:
  ros__parameters:
    # Populate only after the real map section IDs and two stop-line bounds are known.
    ramp_sections: [""]
    acceleration_sections: [""]
    finish_sections: [""]
    # Camera inputs older than this are UNKNOWN, never a latched R or G.
    traffic_timeout_s: 0.3
    min_traffic_confidence: 0.65
    unknown_hold_s: 3.0
    # Commit only after bounded CSV progress passes the line by this distance.
    intersection_commit_margin_m: 0.35
    intersection_modes: [4, 6, 8]
