depth_lidar_perception:
  ros__parameters:
    scan_timeout_s: 0.5
    publish_hz: 20.0
    steering_timeout_s: 0.5
    odom_timeout_s: 0.5
    wheelbase_m: 0.73
    emergency_distance_m: 0.50
    clear_distance_m: 0.60
    mode9_clear_distance_m: 1.5
    mode9_clear_duration_s: 1.0
    steering_slowdown_threshold_deg: 10.0
    steering_slowdown_enter_s: 1.0
    steering_slowdown_exit_s: 1.0
    corridor_half_width_m: 0.30
    minimum_cluster_points: 2
    cluster_gap_m: 0.16
    clear_confirm_scans: 3
    parking_free_distance_m: 1.0
    parking_use_front_lidar: true
    dynamic_velocity_threshold_mps: 0.25
    dynamic_confirmation_count: 3
    dynamic_timeout_s: 0.75
    dynamic_association_distance_m: 0.50
    # Mode 5 front_lidar ROI must never extend beyond 1.5 m.
    mode5_range_m: 1.5
    csv_path_timeout_s: 0.5
    mode5_fov_deg: 80.0
    mode5_lateral_m: 1.0
    vehicle_width_m: 0.80
    obstacle_margin_m: 0.15
    # Commission as "mode:first_route_index:last_route_index" only after
    # Camera object-evidence validity is available. Empty means no suppression.
    speed_bump_zones: [""]

depth_command_arbiter:
  ros__parameters:
    publish_hz: 30.0
    candidate_timeout_s: 0.5

depth_lidar_rejoin_validator:
  ros__parameters:
    # Handoff remains under LiDAR ownership until both endpoint errors meet
    # the commissioned CSV-follower acceptance envelope.
    forward_window: 120
    max_distance_m: 0.25
    max_heading_deg: 10.0

depth_maneuver_manager:
  ros__parameters:
    publish_hz: 20.0
    # This vehicle configuration has one front LiDAR. Its measured A/B slot
    # selection chooses the matching recorded CSV parking case.
    rear_lidar_enabled: false
    wheelbase_m: 0.73
    # Canonical generation constraint. Curvature and radius are derived.
    planner_max_steering_deg: 20.0
    vehicle_width_m: 0.80
    vehicle_length_m: 1.40
    obstacle_margin_m: 0.15
    # After the 2 s observation and measured stop, search the shortest
    # feasible Frenet-style lateral shift and exact CSV rejoin.
    detour_length_m: 1.5
    detour_maximum_ahead_m: 10.0
    planner_maximum_replans: 160
    obstacle_confirmation_s: 2.0
    # Generate only while the last confirmed front_lidar obstacle range is
    # still at least 1.0 m. A closer obstacle remains a stopped condition.
    minimum_planning_lidar_distance_m: 1.0
    stopped_confirmation_s: 0.30
    stopped_linear_speed_mps: 0.03
    stopped_angular_speed_rps: 0.03
    odom_timeout_s: 0.50
