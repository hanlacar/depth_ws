planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      allow_unknown: true
      tolerance: 0.10
      downsample_costmap: false
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      minimum_turning_radius: 2.01
      reverse_penalty: 1.2
      change_penalty: 0.2
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      max_iterations: 500000
      max_planning_time: 4.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      footprint: "[[0.99,0.39],[0.99,-0.39],[-0.41,-0.39],[-0.41,0.39]]"
      footprint_padding: 0.15
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: front_scan
        front_scan:
          topic: /front/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.10
          obstacle_max_range: 10.0
          raytrace_min_range: 0.10
          raytrace_max_range: 12.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.20
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

