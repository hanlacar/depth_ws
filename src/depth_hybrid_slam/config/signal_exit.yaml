depth_signal_exit:
  ros__parameters:
    image_topic: /camera/image_raw
    # All three exit lamps; detections are sorted by image x coordinate.
    exit_roi: [0.05, 0.00, 0.95, 0.40]
    red_1_low: [0, 90, 90]
    red_1_high: [12, 255, 255]
    red_2_low: [168, 90, 90]
    red_2_high: [179, 255, 255]
    green_core_low: [40, 90, 90]
    green_core_high: [85, 255, 255]
    green_extended_low: [86, 60, 50]
    green_extended_high: [110, 255, 125]
    minimum_valid_frames: 60
    decision_ratio: 0.75
    observation_duration_s: 5.0
    track_confirmations: 3
    track_missing_hold_s: 0.25
    track_minimum_confidence: 0.5
