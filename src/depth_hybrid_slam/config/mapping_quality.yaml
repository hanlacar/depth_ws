mapping_quality:
  ready_tracking_seconds: 3.0
  minimum_rgb_fps: 30.0
  minimum_depth_fps: 30.0
  minimum_odometry_fps: 30.0
  maximum_rtabmap_latency_ms: 50.0
  pose_jump_translation_m: 0.75
  pose_jump_rotation_rad: 0.5235987756
  map_correction_translation_m: 0.50
  map_correction_rotation_rad: 0.3490658504
