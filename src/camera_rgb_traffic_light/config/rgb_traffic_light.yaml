rgb_traffic_light_node:
  ros__parameters:
    input_image_topic: /camera/image_raw
    state_topic: /camera/traffic_light_rgb/state
    confidence_topic: /camera/traffic_light_rgb/confidence
    aspect_topic: /camera/traffic_light_rgb/aspect
    diagnostics_topic: /camera/traffic_light_rgb/diagnostics
    overlay_topic: /camera/traffic_light_rgb/overlay_image
    watchdog_rate_hz: 10.0

    # Ratios are resolution-independent. Tune these with mounted-camera data.
    roi_x_min_ratio: 0.05
    roi_x_max_ratio: 0.95
    roi_y_min_ratio: 0.02
    roi_y_max_ratio: 0.55

    minimum_area_ratio: 0.00003
    minimum_signal_area_px: 40
    maximum_area_ratio: 0.012
    minimum_aspect_ratio: 0.25
    maximum_aspect_ratio: 4.0
    minimum_solidity: 0.55
    minimum_convexity: 0.72
    round_minimum_score: 0.80
    left_minimum_score: 0.62
    down_minimum_score: 0.62
    left_direction_margin: 0.12
    other_green_minimum_score: 0.58
    minimum_confidence: 0.55
    conflict_margin: 0.12
    red_priority_confidence: 0.82

    # Preserve dim LED lamps while temporal confirmation and housing/shape
    # checks continue to reject isolated red/green background objects.
    hsv_minimum_saturation: 60
    hsv_minimum_value: 55
    red_hue_low_max: 12
    red_hue_high_min: 168
    yellow_hue_min: 12
    yellow_hue_max: 40
    yellow_s_min: 90
    yellow_v_min: 110
    green_hue_min: 35
    green_hue_max: 105
    green_s_min: 60
    green_v_min: 55
    red_lab_a_min: 130
    yellow_lab_b_min: 145
    green_lab_a_max: 140

    minimum_brightness_delta: 18.0
    minimum_bright_pixel_ratio: 0.45
    red_minimum_brightness_delta: 8.0
    red_minimum_bright_pixel_ratio: 0.20
    green_minimum_brightness_delta: 8.0
    green_minimum_bright_pixel_ratio: 0.20
    housing_expand_ratio: 0.55
    housing_dark_luma_max: 80
    minimum_housing_dark_ratio: 0.08
    dark_pixel_threshold: 80
    dark_ratio_threshold: 0.08
    morphology_open_kernel: 3
    morphology_close_kernel: 3
    reject_roi_boundary_contact: true

    # RED_X: two balanced diagonal strokes crossing near the lamp centre.
    # These thresholds must be re-tuned with the actual signal vehicle.
    red_x_min_diagonal_score: 0.62
    red_x_angle_tolerance_deg: 18.0
    red_x_center_tolerance_ratio: 0.32
    red_x_min_diagonal_balance: 0.55
    red_x_max_circle_score: 0.76
    red_x_max_rectangularity: 0.72
    red_x_hough_threshold: 8
    red_x_min_line_length_ratio: 0.45
    red_x_max_line_gap_ratio: 0.18

    # Shape has priority. If shape is ambiguous, use color only when the
    # candidate is surrounded by a dark lamp housing and is not a solid sign.
    color_fallback_minimum_housing_dark_ratio: 0.20
    color_fallback_maximum_rectangularity: 0.82

    confirmation_frames: 3
    switch_confirmation_frames: 4
    lost_timeout_sec: 0.35
    input_timeout_sec: 0.50
    track_iou_threshold: 0.20
    track_center_distance_ratio: 0.08
