# Provisional safe defaults. Run scripts/inspect_d456.sh and only select profiles
# printed by the connected device. The requested D456 was not connected on
# 2026-09-04, so no hardware-specific profile is claimed here.
camera_name: camera
camera_namespace: camera
enable_color: true
rgb_camera.color_profile: 640,480,60
rgb_camera.color_format: RGB8
enable_depth: true
depth_module.depth_profile: 640,480,30
depth_module.depth_format: Z16
enable_infra: false
enable_infra1: false
enable_infra2: false
enable_gyro: true
enable_accel: true
gyro_fps: 0
accel_fps: 0
unite_imu_method: 2
enable_sync: true
align_depth.enable: true
pointcloud.enable: false
colorizer.enable: false
decimation_filter.enable: false
spatial_filter.enable: false
temporal_filter.enable: false
hole_filling_filter.enable: false
publish_tf: true
tf_publish_rate: 0.0
base_frame_id: camera_link
diagnostics_period: 1.0

