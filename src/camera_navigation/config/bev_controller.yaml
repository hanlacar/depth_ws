direct_bev_controller_node:
  ros__parameters:
    wheelbase_m: 0.73
    maximum_steering_deg: 22.0
    steering_sign: -1.0
    lookahead_min_m: 0.60
    lookahead_default_m: 1.20
    lookahead_max_m: 2.20
    curvature_scale_per_m: 0.80
    degraded_lookahead_scale: 0.85
    steering_rate_deg_per_sec: 120.0
    path_timeout_sec: 0.20
    control_rate_hz: 20.0
    fixed_output_rate_enabled: false
    pair_cache_size: 32
    pair_cache_timeout_sec: 0.25
    # The camera/footprint projection starts the observable safe path several
    # metres ahead of base_link. Measure preview along that path so the forced
    # y=0 connector point cannot erase downstream curvature.
    lookahead_from_path_start: true
    # Preserve sub-degree steering intent across the Int32 vehicle contract.
    fractional_accumulator: true
    steering_lineage_enabled: true
