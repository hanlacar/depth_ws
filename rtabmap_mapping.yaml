# =====================================================================
# rtabmap_mapping.yaml  —  D456 640x480@60 매핑 튜닝
#
# 설계 핵심
#   - visual odometry(rgbd_odometry)는 고속으로 돌린다 (목표 30~50 Hz).
#     저속 주행에서 카메라가 맵을 놓치지 않으려면 pose 추정이 촘촘해야 한다.
#   - rtabmap 맵 그래프 갱신(DetectionRate)은 저속으로 둔다 (1~2 Hz).
#     맵 노드를 매 프레임 추가하면 연산만 폭증하고 이득이 없다.
#   - 따라서 "출력 45~50 FPS" 의 실체는 odom 토픽 rate 다.
#     rtabmap 자체 갱신은 1~2 Hz 가 정상이며 이것이 낮다고 실패가 아니다.
#
# ⚠ 이 파일의 물리/성능 값은 640x480 RGB-D + RTX 5060 기준이다.
#   해상도·프레임을 바꾸면 Vis/MaxFeatures, decimation 을 다시 감사할 것.
# =====================================================================

# ---------- rgbd_odometry (고속 VO) ----------
rgbd_odometry:
  ros__parameters:
    frame_id: "base_link"
    # exact sync: realsense 는 aligned_depth 를 쓰면 rgb/depth 타임스탬프가
    # 동일하므로 approx_sync=false 가 정확하고 빠르다.
    approx_sync: false
    # 큐를 짧게 — 지연 누적을 막는다. 저속이라 큐가 길 이유가 없다.
    queue_size: 10
    # 발행 rate 를 제한하지 않는다(0 = 입력 rate 그대로). 60 입력 → 최대 60 odom.
    # 실측에서 CPU 가 못 따라가면 아래를 30~50 으로 명시해 상한을 건다.
    # OdomF2M/MaxSize 와 특징 수가 실제 상한을 결정한다.
    Rtabmap/DetectionRate: "0"          # odom 노드에서는 무의미하지만 명시
    # --- 특징 검출: 속도·정확도 균형 ---
    Vis/FeatureType: "6"                # 6=GFTT/BRIEF (빠르고 저속에 안정적)
    Vis/MaxFeatures: "600"             # 640x480 에 과하지 않게. 낮추면 더 빠름
    Vis/CorGuessWinSize: "40"
    GFTT/MinDistance: "5"
    GFTT/QualityLevel: "0.001"
    # --- 프레임간 정합 방식 ---
    Odom/Strategy: "0"                  # 0=F2M(Frame-to-Map). 저속 드리프트에 강함
    OdomF2M/MaxSize: "1000"           # 로컬 특징맵 크기. 크면 정확·느림
    Odom/ResetCountdown: "1"           # lost 시 1프레임 뒤 자동 리셋(멈춤 방지)
    Odom/Holonomic: "false"            # Ackermann 차량 — 비홀로노믹
    # --- D456 IMU 활용(선택) ---
    # unite_imu_method 로 합쳐진 /camera/imu 를 guess 로 쓰면 회전 추정이 안정.
    # 런치에서 wait_imu_to_init:=true 와 함께 켠다.
    Odom/GuessMotion: "true"

# ---------- rtabmap (저속 맵 그래프 + 루프클로저) ----------
rtabmap:
  ros__parameters:
    frame_id: "base_link"
    subscribe_depth: true
    subscribe_rgbd: false
    subscribe_scan: false
    approx_sync: false
    queue_size: 10
    # 맵 그래프에 노드를 추가하는 주기 [Hz]. 1~2 면 충분하다.
    # 이 값이 곧 "지도가 갱신되는 속도" 이며 VO(odom) 속도와 별개다.
    Rtabmap/DetectionRate: "2.0"
    # --- 메모리/루프클로저 ---
    Mem/IncrementalMemory: "true"      # 매핑 단계 = true. 대회 주행 시 false.
    Mem/InitWMWithAllNodes: "false"
    RGBD/OptimizeFromGraphEnd: "false"
    RGBD/ProximityBySpace: "true"      # 저속 재방문 시 근접 루프클로저
    RGBD/AngularUpdate: "0.05"         # 이 각도(rad) 이상 돌아야 새 노드
    RGBD/LinearUpdate: "0.05"          # 이 거리(m) 이상 움직여야 새 노드
    # ↑ 저속·소형차라 0.05 로 촘촘히. 정지 중엔 노드가 안 쌓여 DB 가 안 붓는다.
    Kp/MaxFeatures: "500"
    Vis/MaxFeatures: "600"
    Vis/FeatureType: "6"
    # --- 3D 지도 출력 ---
    Grid/FromDepth: "true"
    Grid/RangeMax: "5.0"               # D456 depth 신뢰 상한 근처
    Grid/CellSize: "0.03"              # 1/5 스케일 — 3cm 격자
    Grid/RayTracing: "true"
    Grid/3D: "true"                    # 3D occupancy(옥토맵 대체 내장기능)
    cloud_output_voxelized: true
    # --- TF ---
    publish_tf: true                   # 카메라 단독 매핑 단계에서 map->odom 발행
    tf_delay: 0.02
    # DB 저장: 런치의 database_path 로 지정. delete_db_on_start 는 런치 인자.
